<!DOCTYPE html>
<html lang="th">
<head>
<style>
*{box-sizing:border-box;margin:0;padding:0:}
.container{width:1024px;margin:0 auto;}
header{background-image:url(images/header.jpg);height:256px;}
nav{background-color:pink;height:400px;flex:1;
article{background-color:green;height:400px;flex:3;
footer{background-color:blue;padding10px;text-align:center;color:#ddd;
section{display:flex;}

a:link{
    color:green;
    background-color: purple;
    text-decoration:none;
    display:block;
    width:100%px;
    padding:5px;
}
a:visited{
    color:pink;
    background-color:transparent;
    text-decoration:none;

}
a:hover{
    color:red;
    background-color:yellow;
    text-decoration:none;

}
a:active{
    color:yellow;
    background-color:transparent;
    text-decoration:none;

}
</style>
<meta charset="utf-8">
<title>work8 html layout</title>
</head>
<body>
<div class="container">
<header></header>
<section>
<nav><ul style="list-style-type:none;">
<li><a href="">Coffee</a></li>
<li><a href="">Tea</a></li>
<li><a href="">Milk</a></li>
</ul>
<article></article>
</section>
<footer><p>จัดทำโดยนางสาวปราณิสา เข็มทอง ชั้นม6/9เลขที่30<br>โรงเรียนรัตนราษฎร์บำรุง</footer>
</div>
</body>
</html>
